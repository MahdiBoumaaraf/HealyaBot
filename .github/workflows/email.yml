name: Course Center Email Intake

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
      timezone: "Africa/Algiers"
  workflow_dispatch:

jobs:
  poll-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Poll university email
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FOLDER: ${{ secrets.EMAIL_FOLDER }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          EMAIL_INGEST_SECRET: ${{ secrets.EMAIL_INGEST_SECRET }}
        run: python email_poller.py
